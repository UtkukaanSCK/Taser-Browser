<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>X-Browser</title>
<link rel="stylesheet" href="/app.css">
<script src="/js/core.js" defer></script>
<script src="/js/strip.js" defer></script>
<script src="/js/suggest.js" defer></script>
<script src="/js/bookmarks.js" defer></script>
<script src="/js/security.js" defer></script>
<script src="/js/ext-button.js" defer></script>
</head>
<body class="bg-strip text-ink font-sans text-[13px] leading-none">
<div id="strip" class="relative flex h-10 items-center gap-1 border-b border-line pl-1.5">
  <!-- Top-edge resize handles (the native window has no top border to grab). -->
  <div id="resizer" class="absolute inset-x-0 top-0 z-10 flex h-[3px]">
    <div data-resize="nw" class="w-2 cursor-nw-resize"></div>
    <div data-resize="n" class="flex-1 cursor-n-resize"></div>
    <div data-resize="ne" class="w-2 cursor-ne-resize"></div>
  </div>

  <button id="back" class="nav" title="Geri (Alt+Sol)" aria-label="Geri" disabled>
    <svg viewBox="0 0 16 16"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg>
  </button>
  <button id="forward" class="nav" title="İleri (Alt+Sağ)" aria-label="İleri" disabled>
    <svg viewBox="0 0 16 16"><path d="m6 3.5 4.5 4.5L6 12.5"/></svg>
  </button>
  <button id="reload" class="nav group" title="Yenile (Ctrl+R)" aria-label="Yenile">
    <svg class="group-data-[loading]:hidden" viewBox="0 0 16 16"><path d="M12.5 8a4.5 4.5 0 1 1-1.3-3.2M12.5 3v2.5H10"/></svg>
    <svg class="hidden group-data-[loading]:block" viewBox="0 0 16 16"><path d="m4.5 4.5 7 7m0-7-7 7"/></svg>
  </button>

  <!-- Narrow windows: the address box gives up width first (down to min-w-25). -->
  <div id="address-box" class="ml-1 flex h-7 w-[clamp(140px,34vw,520px)] min-w-25 shrink items-center rounded-md border border-line bg-surface px-2 transition-colors duration-100 focus-within:border-accent data-[blocked]:border-danger">
    <!-- Connection state of the shown page (security.js): a lock, "not secure",
         a certificate error, or a crashed page with its reload button. The
         mark itself is no control; its meaning is the status text after it,
         unseen but read out whenever it changes. -->
    <div id="security" hidden
         class="group/sec -ml-1 mr-1 flex h-5 max-w-[60%] shrink-0 items-center gap-1 px-1 text-[11px] text-muted">
      <svg aria-hidden="true" class="hidden size-3 shrink-0 group-data-[state=secure]/sec:block" viewBox="0 0 16 16"><path d="M4.5 7.5h7V13h-7zM6 7.5v-2a2 2 0 0 1 4 0v2"/></svg>
      <svg aria-hidden="true" class="size-3 shrink-0 group-data-[state=cert]/sec:text-danger group-data-[state=crashed]/sec:text-danger group-data-[state=secure]/sec:hidden" viewBox="0 0 16 16"><path d="M8 2.5 14 13H2zM8 6.5v3M8 11.25v.01"/></svg>
      <span id="security-text" aria-hidden="true" class="min-w-0 truncate text-ink empty:hidden"></span>
      <button id="security-reload" type="button" hidden title="Sayfayı yeniden yükle (Ctrl+R)"
              class="shrink-0 rounded px-1 text-ink underline hover:bg-hover focus-visible:outline-2 focus-visible:outline-accent">Yeniden yükle</button>
    </div>
    <!-- Outside the mark, so it is still there to say that a mark went away. -->
    <span id="security-status" role="status" aria-live="polite" class="sr-only"></span>
    <input id="address" type="text" spellcheck="false" autocomplete="off" aria-label="Adres"
           placeholder="Ara ya da adres gir"
           class="h-full w-full min-w-0 bg-transparent text-ink outline-none select-text placeholder:text-muted">
    <!-- Page zoom other than 100% (core.js); a click resets it. -->
    <button id="zoom" hidden tabindex="-1"
            class="ml-1 flex h-5 shrink-0 items-center gap-0.5 rounded px-1 text-[11px] tabular-nums text-muted hover:bg-hover hover:text-ink">
      <svg class="size-3" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.25"/><path d="m10.25 10.25 3.25 3.25"/></svg>
      <span id="zoom-level"></span>
    </button>
    <!-- Bookmark star (bookmarks.js): filled while the page is bookmarked. -->
    <button id="bm-star" type="button" disabled aria-label="Yer imi" aria-pressed="false" title="Bu sayfayı yer imlerine ekle (Ctrl+D)"
            class="group ml-1 flex size-5 shrink-0 items-center justify-center rounded text-muted hover:bg-hover hover:text-ink focus-visible:outline-2 focus-visible:outline-accent disabled:opacity-35 disabled:hover:bg-transparent aria-pressed:text-accent">
      <svg class="size-3.5 group-aria-pressed:fill-current" viewBox="0 0 16 16"><path d="M8 1.5l1.95 4.1 4.55.6-3.3 3.15.8 4.45L8 11.55 3.99 13.8l.8-4.45L1.5 6.2l4.55-.6z"/></svg>
    </button>
  </div>

  <!-- Tab zone: never narrower than the scroll arrows + one tab + "+" + pr-8 of
       empty drag area. Tabs that do not fit scroll inside #tablist; the arrows
       show only then (data-overflow, set by strip.js). -->
  <div id="tabs" data-drag class="group/tabs ml-1 flex h-full min-w-[130px] flex-1 items-center overflow-hidden pr-8">
    <button id="tab-left" class="arrow" tabindex="-1" aria-hidden="true" title="Önceki sekmeler" aria-label="Önceki sekmeler">
      <svg class="size-3" viewBox="0 0 16 16"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg>
    </button>
    <div id="tablist" role="tablist" aria-label="Sekmeler" class="relative flex h-full min-w-0 flex-[0_1_auto] items-center overflow-x-auto overflow-y-hidden [scrollbar-width:none]"></div>
    <button id="tab-right" class="arrow" tabindex="-1" aria-hidden="true" title="Sonraki sekmeler" aria-label="Sonraki sekmeler">
      <svg class="size-3" viewBox="0 0 16 16"><path d="m6 3.5 4.5 4.5L6 12.5"/></svg>
    </button>
    <button id="new-tab" class="nav shrink-0" title="Yeni sekme (Ctrl+T)" aria-label="Yeni sekme">
      <svg viewBox="0 0 16 16"><path d="M8 3.5v9M3.5 8h9"/></svg>
    </button>
  </div>

  <!-- Downloads (shown once this session has had a download; core.js,
       xb.downloads) and the main menu. -->
  <!-- Extensions with a popup (shown only while an enabled one has one;
       ext-button.js, src/ext_ui.rs). -->
  <button id="ext-btn" class="nav" title="Uzantılar" aria-label="Uzantılar" aria-haspopup="menu" hidden>
    <svg viewBox="0 0 16 16"><path d="M3 5.5h2.5a1.5 1.5 0 1 1 3 0H11v2.5a1.5 1.5 0 1 1 0 3V13.5H8.5a1.5 1.5 0 1 0-3 0H3v-2.5a1.5 1.5 0 1 0 0-3z"/></svg>
  </button>
  <button id="downloads-btn" class="nav group relative" title="İndirilenler (Ctrl+J)" aria-label="İndirilenler" hidden>
    <svg viewBox="0 0 16 16"><path d="M8 2.5v8m-3-3 3 3 3-3M3.5 13h9"/></svg>
    <span class="absolute right-1 top-1 hidden size-1.5 rounded-full bg-accent group-data-[busy]:block"></span>
  </button>
  <button id="menu-btn" class="nav mr-1" title="Menü (Alt+F)" aria-label="Menü" aria-haspopup="menu">
    <svg viewBox="0 0 16 16"><path d="M8 3.5v.01M8 8v.01m0 4.49v.01" stroke-width="2"/></svg>
  </button>

  <div class="flex h-full shrink-0 self-stretch">
    <button id="min" class="win" title="Simge durumuna küçült" aria-label="Küçült">
      <svg viewBox="0 0 16 16"><path d="M3.5 8h9"/></svg>
    </button>
    <button id="max" class="win group" title="Ekranı kapla" aria-label="Ekranı kapla">
      <svg class="group-data-[max]:hidden" viewBox="0 0 16 16"><path d="M3.5 3.5h9v9h-9z"/></svg>
      <svg class="hidden group-data-[max]:block" viewBox="0 0 16 16"><path d="M3.5 5.5h7v7h-7zM5.5 5.5v-2h7v7h-2"/></svg>
    </button>
    <button id="close" class="win hover:bg-danger hover:text-white" title="Kapat" aria-label="Kapat">
      <svg viewBox="0 0 16 16"><path d="m4 4 8 8m0-8-8 8"/></svg>
    </button>
  </div>

  <div id="loadbar" class="pointer-events-none absolute inset-x-0 -bottom-px h-0.5 bg-accent opacity-0 transition-opacity duration-100 data-[on]:opacity-100"></div>
</div>

<!-- Fullscreen notice (core.js, xb.notice). While it is up the UI webview is
     only this band over the top of the page, and the strip under it is inert.
     The site name comes from the host, set through textContent only. -->
<div id="fs-notice" hidden role="status"
     class="fixed inset-0 z-50 flex items-center justify-center overflow-hidden whitespace-nowrap bg-[#202124] px-4 text-[13px] text-white">
  <span id="fs-notice-site" dir="ltr" class="font-semibold"></span><span id="fs-notice-text"></span>
</div>

<!-- A tab shrinks from 200px down to min-w-9 (36px); past that the list scrolls.
     The visible part (.tab-body) is inset inside it and sheds its contents as
     the tab narrows (container queries on the tab's own width; which child
     shows when is in input.css, .tab rules):
     76px = an inactive tab hides its close button, every tab its sound button,
     52px = no title: an inactive tab shows its icon, the active tab only its
            close button (and an accent border).
     Below 76px, in place of the sound button, a tab playing audio has a dot
     in its corner (.tab-body::after). -->
<template id="tab-tpl">
  <div role="tab" tabindex="-1" aria-selected="false" class="tab group @container relative h-7 w-[200px] min-w-9 flex-[0_1_200px] overflow-hidden outline-none data-[dragging]:z-10 data-[dragging]:opacity-85">
    <div class="tab-body absolute inset-x-px inset-y-0 flex items-center gap-1.5 overflow-hidden rounded-md border border-transparent ps-2 pe-1 text-muted transition-colors duration-100 group-hover:bg-hover group-focus-visible:outline-2 group-focus-visible:-outline-offset-2 group-focus-visible:outline-accent group-aria-selected:border-line group-aria-selected:bg-surface group-aria-selected:text-ink @max-[52px]:justify-center @max-[52px]:gap-0 @max-[52px]:px-0 @max-[52px]:group-aria-selected:border-accent">
      <span class="fav size-4 shrink-0 items-center justify-center">
        <span class="dot size-1.5 rounded-full bg-accent"></span>
        <img class="icon size-4" alt="" draggable="false">
        <svg class="glyph size-3.5" viewBox="0 0 16 16"><path d="M4.5 2.5H9l2.5 2.5v8.5h-7zM9 2.5V5h2.5"/></svg>
      </span>
      <span class="title min-w-0 flex-1 truncate leading-normal"></span>
      <button class="audio size-5 shrink-0 items-center justify-center rounded hover:bg-line hover:text-ink" tabindex="-1" aria-hidden="true" title="Sesi kapat" aria-label="Sesi kapat">
        <svg class="sound size-3.5" viewBox="0 0 16 16"><path d="M2.5 6h2l3-2.5v9l-3-2.5h-2zM10 6a2.5 2.5 0 0 1 0 4m1.5-6a5 5 0 0 1 0 8"/></svg>
        <svg class="silent size-3.5" viewBox="0 0 16 16"><path d="M2.5 6h2l3-2.5v9l-3-2.5h-2zM10 6l4 4m0-4-4 4"/></svg>
      </button>
      <button class="close size-5 shrink-0 items-center justify-center rounded text-muted hover:bg-line hover:text-ink" tabindex="-1" aria-hidden="true" title="Sekmeyi kapat (Ctrl+W)" aria-label="Sekmeyi kapat">
        <svg class="size-3" viewBox="0 0 16 16"><path d="m4 4 8 8m0-8-8 8"/></svg>
      </button>
    </div>
  </div>
</template>
</body>
</html>
