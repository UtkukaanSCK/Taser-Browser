[package]
name = "taser"
version = "0.1.0"
edition = "2024"
# Let chains (src/) and the newest dependencies (icu_*, time) need 1.88;
# `usize::is_multiple_of` (build.rs, src/instance.rs) needs 1.90.
rust-version = "1.90"
description = "A light, fast, minimalist desktop web browser on the system WebView"
license = "MIT"

[dependencies]
# Window + event loop. wry's own dependency; required to host webviews.
tao = "0.37.2"
# System WebView (WebView2 on Windows) with multi-webview support (`build_as_child`).
wry = "0.57.2"
# session.json / window.json (src/store.rs). The only crates added for
# persistence; serde itself was already in the build graph (a wry build dep).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Inflate for the zip inside a CRX package (src/crx.rs). Pure Rust; pulls only
# adler2. Signature checks and SHA-256 use the OS (CNG) instead of a crate.
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }

# Windows-only glue for WebView2 events wry does not expose (SourceChanged,
# HistoryChanged, NavigationStarting/Completed, AcceleratorKeyPressed, Stop).
# Both are already transitive dependencies of wry at these exact versions, so
# they add no new code to the build graph or the binary.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Networking_WinHttp",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[features]
# Automated in-app scenario test (`cargo run --features selftest`). Never part
# of the release binary.
selftest = []

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
