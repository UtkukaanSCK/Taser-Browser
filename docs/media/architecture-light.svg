<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Architecture: one window with a UI strip webview, one webview per content tab and an overlay webview, all driven by the Rust core over IPC.">
<style>
text{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:ui-monospace,'Cascadia Mono',Consolas,'SFMono-Regular',Menlo,monospace}
.flow{stroke-dasharray:6 8;animation:flow 1.2s linear infinite}
.flow.r{animation-direction:reverse}
@keyframes flow{to{stroke-dashoffset:-28}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="1200" height="470" rx="20" fill="#f7faff" stroke="#c3d1ea"/>
<rect x="40" y="40" width="640" height="390" rx="18" fill="#dfe9fb" stroke="#c3d1ea" stroke-width="1.5"/><text x="60" y="70" font-size="13" font-weight="700" letter-spacing="1.5" fill="#8a9abb">ONE TAO WINDOW · THREE KINDS OF WEBVIEW2</text><rect x="60" y="88" width="600" height="84" rx="14" fill="#f3f7fe" stroke="#c3d1ea" stroke-width="1.5"/><text x="78" y="118" font-size="17" font-weight="700" fill="#121c33">Tab strip and address bar</text><text x="78" y="142" font-size="14" fill="#4b5b7c">ui/index.html · vanilla JS + Tailwind · profile XbUi, no extensions</text><rect x="60" y="190" width="600" height="220" rx="14" fill="#f3f7fe" stroke="#c3d1ea" stroke-width="1.5"/><text x="78" y="220" font-size="17" font-weight="700" fill="#121c33">Content tabs</text><text x="78" y="244" font-size="14" fill="#4b5b7c">one WebView2 per tab · content profile</text><text x="78" y="265" font-size="14" fill="#4b5b7c">Chrome extensions (MV3), uBlock Origin Lite</text><text x="78" y="286" font-size="14" fill="#4b5b7c">tracking prevention, HTTPS-only, GPC</text><rect x="340" y="276" width="300" height="118" rx="14" fill="#f3f7fe" stroke="#c3d1ea" stroke-width="1.5" stroke-dasharray="6 6"/><text x="358" y="306" font-size="17" font-weight="700" fill="#121c33">Overlay</text><text x="358" y="330" font-size="14" fill="#4b5b7c">menus, suggestions, site panel,</text><text x="358" y="351" font-size="14" fill="#4b5b7c">questions, Uzantılar · profile XbUi</text><rect x="840" y="40" width="320" height="390" rx="14" fill="#f3f7fe" stroke="#c3d1ea" stroke-width="1.5"/><text x="858" y="70" font-size="17" font-weight="700" fill="#121c33">Rust core</text><rect x="858" y="96" width="284" height="44" rx="10" fill="#d9e3f6" opacity=".6"/><text x="872" y="116" font-size="14" font-weight="600" class="mono" fill="#121c33">app.rs</text><text x="872" y="133" font-size="13" fill="#4b5b7c">state, layout, IPC</text><rect x="858" y="150" width="284" height="44" rx="10" fill="#d9e3f6" opacity=".6"/><text x="872" y="170" font-size="14" font-weight="600" class="mono" fill="#121c33">tabs.rs · session.rs</text><text x="872" y="187" font-size="13" fill="#4b5b7c">tabs, restore</text><rect x="858" y="204" width="284" height="44" rx="10" fill="#d9e3f6" opacity=".6"/><text x="872" y="224" font-size="14" font-weight="600" class="mono" fill="#121c33">policy.rs · privacy.rs</text><text x="872" y="241" font-size="13" fill="#4b5b7c">indicator, privacy switches</text><rect x="858" y="258" width="284" height="44" rx="10" fill="#d9e3f6" opacity=".6"/><text x="872" y="278" font-size="14" font-weight="600" class="mono" fill="#121c33">history.rs · bookmarks.rs</text><text x="872" y="295" font-size="13" fill="#4b5b7c">local JSON files</text><rect x="858" y="312" width="284" height="44" rx="10" fill="#d9e3f6" opacity=".6"/><text x="872" y="332" font-size="14" font-weight="600" class="mono" fill="#121c33">webstore.rs · crx.rs</text><text x="872" y="349" font-size="13" fill="#4b5b7c">signed installs</text><rect x="858" y="366" width="284" height="44" rx="10" fill="#d9e3f6" opacity=".6"/><text x="872" y="386" font-size="14" font-weight="600" class="mono" fill="#121c33">native/*</text><text x="872" y="403" font-size="13" fill="#4b5b7c">WebView2 COM hooks</text><path class="flow" d="M684 124H832" stroke="#2f6fe0" stroke-width="2.2" fill="none"/><path class="flow r" d="M684 136H832" stroke="#8a9abb" stroke-width="2.2" fill="none"/><text x="760" y="116" text-anchor="middle" font-size="12" fill="#4b5b7c">IPC commands</text><path class="flow" d="M684 254H832" stroke="#2f6fe0" stroke-width="2.2" fill="none"/><path class="flow r" d="M684 266H832" stroke="#8a9abb" stroke-width="2.2" fill="none"/><text x="760" y="246" text-anchor="middle" font-size="12" fill="#4b5b7c">navigation, policy</text><path class="flow" d="M684 334H832" stroke="#2f6fe0" stroke-width="2.2" fill="none"/><path class="flow r" d="M684 346H832" stroke="#8a9abb" stroke-width="2.2" fill="none"/><text x="760" y="326" text-anchor="middle" font-size="12" fill="#4b5b7c">draw / close</text><circle class="pulse" cx="1136" cy="64" r="5" fill="#15803d"/>
</svg>
