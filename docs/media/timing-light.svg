<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Start-up to ui-ready: v0.1 308 ms, v0.2 362 ms, v0.3 421 ms. Binary: 0.68, 1.26 and 1.66 MB.">
<style>
