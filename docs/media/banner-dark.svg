<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="X-Browser: a light, minimal desktop browser in Rust on WebView2">
<style>
text{font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:ui-monospace,'Cascadia Mono',Consolas,'SFMono-Regular',Menlo,monospace}
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.chip{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.glow{animation:drift 14s ease-in-out infinite alternate;transform-origin:center}
@keyframes drift{from{transform:translate(-30px,10px) scale(1)}to{transform:translate(40px,-20px) scale(1.15)}}
.mock{animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.t2{animation:t2 9s infinite both} .t3{animation:t3 9s infinite both}
@keyframes t2{0%,6%{opacity:0;transform:translateX(-24px)}12%,94%{opacity:1;transform:none}100%{opacity:0}}
@keyframes t3{0%,14%{opacity:0;transform:translateX(-24px)}20%,94%{opacity:1;transform:none}100%{opacity:0}}
.type{transform-box:fill-box;transform-origin:left center;animation:type 9s steps(27) infinite both}
@keyframes type{0%,24%{transform:scaleX(0)}46%,94%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.caret{animation:caret 9s linear infinite}
@keyframes caret{0%,24%{transform:translateX(0)}46%,100%{transform:translateX(227px)}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.lock{animation:lock 9s infinite both}
@keyframes lock{0%,47%{opacity:0;transform:scale(.6)}52%,94%{opacity:1;transform:none}100%{opacity:0}}
.lock{transform-box:fill-box;transform-origin:center}
.bar{transform-box:fill-box;transform-origin:left center;animation:bar 9s cubic-bezier(.4,0,.2,1) infinite both}
@keyframes bar{0%,47%{transform:scaleX(0);opacity:1}62%{transform:scaleX(1);opacity:1}66%,100%{transform:scaleX(1);opacity:0}}
.sk{animation:sk 9s infinite both}
@keyframes sk{0%,60%{opacity:0;transform:translateY(8px)}68%,94%{opacity:1;transform:none}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@media (prefers-reduced-motion: reduce){.caret{display:none}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0f14"/><stop offset="1" stop-color="#141823"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#3b6cff" stop-opacity="0.22"/><stop offset="1" stop-color="#3b6cff" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#232838"/></pattern>
<linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#f4f4f5"/><stop offset="1" stop-color="#5b8cff"/></linearGradient>
<linearGradient id="barg" x1="0" x2="1"><stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#9db8ff"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.45"/></filter>
<clipPath id="urlclip"><rect class="type" x="724" y="122" height="24" width="227"/></clipPath>
<clipPath id="mockclip"><rect x="640" y="62" width="500" height="300" rx="14"/></clipPath>
</defs>
<rect width="1200" height="420" rx="24" fill="url(#bg)"/>
<rect width="1200" height="420" rx="24" fill="url(#dots)" opacity=".8"/>
<g class="glow"><circle cx="880" cy="200" r="320" fill="url(#glow)"/></g>
<g class="rise"><rect x="64" y="70" width="84" height="84" rx="18.5" fill="#2F62E9"/><path d="M89.2 95.2L122.8 128.8M122.8 95.2L89.2 128.8" stroke="#fff" stroke-width="12.6" stroke-linecap="round"/></g>
<g class="rise" style="animation-delay:.12s"><text x="62" y="222" font-size="72" font-weight="700" letter-spacing="-2" fill="url(#title)">X-Browser</text></g>
<g class="rise" style="animation-delay:.24s"><text x="64" y="262" font-size="22" fill="#a1a1aa">A light, minimal desktop browser in Rust</text>
<text x="64" y="292" font-size="22" fill="#a1a1aa">on the system WebView, built with wry + tao only.</text></g>
<g class="chip" style="animation-delay:0.35s"><rect x="64" y="318" width="56" height="32" rx="16" fill="#1b2340" stroke="#3f3f46"/><text x="92.2" y="339" text-anchor="middle" font-size="15" font-weight="600" fill="#c7d6ff">Rust</text></g><g class="chip" style="animation-delay:0.47s"><rect x="130.4" y="318" width="95" height="32" rx="16" fill="#1b2340" stroke="#3f3f46"/><text x="177.8" y="339" text-anchor="middle" font-size="15" font-weight="600" fill="#c7d6ff">WebView2</text></g><g class="chip" style="animation-delay:0.59s"><rect x="235.2" y="318" width="85" height="32" rx="16" fill="#1b2340" stroke="#3f3f46"/><text x="277.8" y="339" text-anchor="middle" font-size="15" font-weight="600" fill="#c7d6ff">1.66 MB</text></g><g class="chip" style="animation-delay:0.71s"><rect x="330.4" y="318" width="47" height="32" rx="16" fill="#1b2340" stroke="#3f3f46"/><text x="353.8" y="339" text-anchor="middle" font-size="15" font-weight="600" fill="#c7d6ff">MIT</text></g>
<g class="mock"><g filter="url(#sh)">
<rect x="640" y="62" width="500" height="300" rx="14" fill="#2c2c2e" stroke="#3f3f46"/>
</g>
<g clip-path="url(#mockclip)">
<rect x="640" y="62" width="500" height="98" fill="#1c1c1e"/>
<line x1="640" x2="1140" y1="160" y2="160" stroke="#3f3f46"/>
<g class="t1"><rect x="652" y="74" width="128" height="30" rx="8" fill="#2c2c2e" stroke="#3f3f46"/><circle cx="670" cy="89" r="6" fill="#2F62E9"/><rect x="684" y="85" width="60" height="8" rx="4" fill="#71717a" opacity=".7"/><path d="M762 85l8 8m0-8l-8 8" stroke="#71717a" stroke-width="1.6" stroke-linecap="round"/></g>
<g class="t2"><rect x="786" y="74" width="128" height="30" rx="8" fill="#2c2c2e" stroke="#3f3f46"/><circle cx="804" cy="89" r="6" fill="#f59e0b"/><rect x="818" y="85" width="70" height="8" rx="4" fill="#71717a" opacity=".7"/><path d="M896 85l8 8m0-8l-8 8" stroke="#71717a" stroke-width="1.6" stroke-linecap="round"/></g>
<g class="t3"><rect x="920" y="74" width="128" height="30" rx="8" fill="#2c2c2e" stroke="#3f3f46"/><circle cx="938" cy="89" r="6" fill="#10b981"/><rect x="952" y="85" width="50" height="8" rx="4" fill="#71717a" opacity=".7"/><path d="M1030 85l8 8m0-8l-8 8" stroke="#71717a" stroke-width="1.6" stroke-linecap="round"/></g>
<path d="M1064 89h12M1070 83v12" stroke="#a1a1aa" stroke-width="1.8" stroke-linecap="round"/>
<path d="M662 134l-6 0m0 0l4-4m-4 4l4 4" stroke="#a1a1aa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<path d="M680 134l6 0m0 0l-4-4m4 4l-4 4" stroke="#71717a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<rect x="694" y="118" width="400" height="32" rx="16" fill="#2c2c2e" stroke="#3f3f46"/>
<g class="lock"><rect x="704" y="131" width="11" height="9" rx="2" fill="#4ade80"/><path d="M706.5 131v-3a3 3 0 0 1 6 0v3" stroke="#4ade80" stroke-width="1.8" fill="none"/></g>
<text x="724" y="138" font-size="14" class="mono" fill="#f4f4f5" clip-path="url(#urlclip)">example.com/hello-x-browser</text>
<g class="caret"><rect class="blink" x="725" y="125" width="1.6" height="17" fill="#5b8cff"/></g>
<circle cx="1114" cy="134" r="2" fill="#a1a1aa"/><circle cx="1114" cy="128" r="2" fill="#a1a1aa"/><circle cx="1114" cy="140" r="2" fill="#a1a1aa"/>
<rect class="bar" x="640" y="158" height="3" width="500" fill="url(#barg)"/>
<rect class="sk" style="animation-delay:0.00s" x="672" y="192" width="300" height="18" rx="9.0" fill="#5b8cff" opacity="0.9"/><rect class="sk" style="animation-delay:0.08s" x="672" y="226" width="420" height="10" rx="5.0" fill="#71717a" opacity="0.35"/><rect class="sk" style="animation-delay:0.16s" x="672" y="246" width="380" height="10" rx="5.0" fill="#71717a" opacity="0.35"/><rect class="sk" style="animation-delay:0.24s" x="672" y="266" width="400" height="10" rx="5.0" fill="#71717a" opacity="0.35"/><rect class="sk" style="animation-delay:0.32s" x="672" y="286" width="240" height="10" rx="5.0" fill="#71717a" opacity="0.35"/>
<rect class="sk" style="animation-delay:0.40s" x="672" y="302" width="96" height="40" rx="10" fill="#38383b"/><rect class="sk" style="animation-delay:0.47s" x="784" y="302" width="96" height="40" rx="10" fill="#38383b"/><rect class="sk" style="animation-delay:0.54s" x="896" y="302" width="96" height="40" rx="10" fill="#38383b"/><rect class="sk" style="animation-delay:0.61s" x="1008" y="302" width="96" height="40" rx="10" fill="#38383b"/>
</g></g>
</svg>
